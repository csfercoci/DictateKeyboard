name: Android Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew ./tools/fetch-sherpa-onnx.sh

      - name: Fetch sherpa-onnx runtime artifacts
        run: ./tools/fetch-sherpa-onnx.sh

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
